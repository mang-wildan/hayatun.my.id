# Konteks `http` (T57; ARCHITECTURE bagian 6, N1, N5, N30). Sisipkan di nginx.conf atau di bagian http aaPanel, sebelum vhost.
# Berisi: upstream, TLS, format log tanpa query string dan tanpa token unduhan, serta zona batas laju.

upstream hayatun_web { server 127.0.0.1:3000; keepalive 16; } # Next.js
upstream hayatun_api { server 127.0.0.1:4000; keepalive 16; } # Express

server_tokens off; # versi Nginx tidak ditampilkan

# TLS 1.2 dan 1.3 saja (N1). Ini dipasang di tingkat http; hapus `ssl_protocols` di vhost aaPanel supaya tidak menimpanya.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:hayatun_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# N30: yang dicatat adalah $uri (tanpa query string), dan token di /api/downloads/<token> disamarkan.
map $uri $hayatun_log_uri {
  ~^/api/downloads/ "/api/downloads/[disamarkan]";
  default           $uri;
}
# Tanpa cookie, Authorization, referer, user agent, atau isi permintaan. $request_id dibuat Nginx dan juga dikirim ke Next.js dan Express.
log_format hayatun '$remote_addr [$time_iso8601] $request_id "$request_method $hayatun_log_uri" $status $body_bytes_sent $request_time';

# Batas laju per IP hanya untuk rute akun: kunci kosong (rute lain) tidak dibatasi.
map $uri $hayatun_auth_key {
  ~^/api/auth/(login|login/totp|register|forgot-password|reset-password|resend-verification)$ $binary_remote_addr;
  default "";
}
limit_req_zone $hayatun_auth_key zone=hayatun_auth:10m rate=10r/m;
limit_req_status 429;
