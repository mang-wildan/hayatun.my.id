# Isi blok `server` HTTPS (T57). Vhost aaPanel tetap yang memegang listen, server_name, sertifikat, dan access_log:
#   access_log /www/wwwlogs/hayatun.my.id.log hayatun;     # pakai format `hayatun` dari hayatun-http.conf
#   error_log  /www/wwwlogs/hayatun.my.id.error.log error; # lihat docs/nginx.md: error_log memuat baris permintaan lengkap
# lalu: include /path/ke/ops/nginx/hayatun-server.conf;

# Batas isi permintaan bawaan sama dengan Express (JSON 100 KB). Rute unggah punya batas sendiri di bawah.
client_max_body_size 100k;

# Header keamanan. add_header di dalam location menimpa yang ada di sini, jadi location di bawah tidak memakainya.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Request-Id $request_id always;

# Proxy (diwariskan ke semua location di bawah, karena tidak ada yang menulis proxy_set_header sendiri).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr; # Nginx adalah tepi; kiriman klien tidak dipercaya
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;     # dibuat di sini, bukan dari klien
# Header keamanan dari hulu (helmet di Express, Next.js) disembunyikan supaya hanya satu set yang sampai ke klien.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Request-Id;

limit_req zone=hayatun_auth burst=5 nodelay; # lihat hayatun_auth_key di hayatun-http.conf

# Berkas tersembunyi (.env, .git) tidak pernah dilayani; .well-known tetap lewat untuk sertifikat.
location ~ /\.(?!well-known/) { return 404; }

# N5: file privat. Hanya bisa dicapai lewat X-Accel-Redirect dari API setelah pemeriksaan akses; permintaan langsung dari luar mendapat 404.
location /_internal/files/ {
  internal;
  alias /srv/hayatun/files/;
}

# Unggahan: bukti bayar 6 MB (API menolak > 5 MB), sampul 6 MB, file produk sesuai PRODUCT_FILE_MAX_MB (bawaan 500) + sedikit ruang.
location ~ ^/api/orders/[^/]+/proof$        { client_max_body_size 6m;   proxy_pass http://hayatun_api; }
location ~ ^/api/admin/products/[^/]+/cover$ { client_max_body_size 6m;   proxy_pass http://hayatun_api; }
location ~ ^/api/admin/products/[^/]+/files$ {
  client_max_body_size 512m;
  proxy_request_buffering off;
  proxy_send_timeout 600s;
  proxy_pass http://hayatun_api;
}

location /api/ { proxy_pass http://hayatun_api; }
location /     { proxy_pass http://hayatun_web; }
